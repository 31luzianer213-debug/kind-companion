# Configuração do Nginx para Proxy Reverso da aplicação na porta 3000
# Copie para /etc/nginx/sites-available/kind-companion e crie o link simbólico em sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com www.seudominio.com;

    # Redireciona HTTP para HTTPS após configurar o Certbot
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
